<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="马天赐 · AI应用 / 运营 / 项目管理 / 新媒体运营" />
<title>马天赐 — 简历</title>
<script>document.documentElement.className += ' js';</script>
<style>
/* =========================================================
   Tokens
   ========================================================= */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#ffffff;
  --bg-soft:#fafafa;
  --text:#0f0f0f;
  --text-2:#6b6b6b;
  --text-3:#9b9b9b;
  --line:#e8e8e8;
  --line-2:#f2f2f2;
  --accent:#1a56db;
  --accent-bg:#f0f5ff;
  --nav-bg:rgba(255,255,255,.82);
  --shadow:0 1px 2px rgba(0,0,0,.04);
}

[data-theme="dark"]{
  --bg:#0a0a0a;
  --bg-soft:#141414;
  --text:#ededed;
  --text-2:#a0a0a0;
  --text-3:#666666;
  --line:#262626;
  --line-2:#1c1c1c;
  --accent:#7aa2ff;
  --accent-bg:#18233f;
  --nav-bg:rgba(10,10,10,.82);
  --shadow:0 1px 2px rgba(0,0,0,.5);
}

html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
    "Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15.5px;
  line-height:1.8;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  transition:background-color .2s ease,color .2s ease;
  overflow-x:hidden;
}

a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
ul{list-style:none}
img,svg{display:block;max-width:100%}
::selection{background:var(--accent-bg);color:var(--accent)}

/* =========================================================
   Layout
   ========================================================= */
.wrap{width:min(880px,100% - 48px);margin-inline:auto}
.section{padding:72px 0 0;scroll-margin-top:72px}
.section:last-of-type{padding-bottom:72px}

/* =========================================================
   Nav
   ========================================================= */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:50;
  background:var(--nav-bg);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line-2);
  transition:background-color .2s ease,border-color .2s ease;
}
.nav-inner{
  width:min(880px,100% - 48px);margin-inline:auto;height:60px;
  display:flex;align-items:center;gap:16px;
}
.brand{font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.nav-links{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{
  padding:6px 11px;font-size:13.5px;font-weight:500;color:var(--text-2);
  border-radius:6px;white-space:nowrap;
  transition:color .15s ease,background-color .15s ease;
}
.nav-links a:hover{color:var(--text)}
.nav-links a.is-active{color:var(--accent)}
.nav-actions{display:flex;align-items:center;gap:4px}
.icon-btn{
  width:34px;height:34px;display:grid;place-items:center;border-radius:8px;
  color:var(--text-2);font-size:15px;
  transition:background-color .15s ease,color .15s ease;
}
.icon-btn:hover{background:var(--line-2);color:var(--text)}
.print-btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 14px;
  font-size:13px;font-weight:600;color:var(--bg);background:var(--text);
  border-radius:7px;transition:opacity .15s ease,transform .15s ease;
}
.print-btn:hover{opacity:.85;transform:translateY(-1px)}
.print-btn svg{width:13px;height:13px}

/* =========================================================
   Hero
   ========================================================= */
.hero{padding-top:132px}
.hero h1{
  font-size:clamp(44px,8vw,76px);font-weight:700;
  letter-spacing:-.035em;line-height:1.05;margin-bottom:16px;
}
.hero-roles{
  font-size:clamp(14px,1.8vw,16px);font-weight:500;color:var(--text-2);
  letter-spacing:.01em;margin-bottom:28px;
}
.hero-roles span{color:var(--text-2)}
.hero-roles .sep{color:var(--text-3);margin:0 8px}
.hero-summary{
  font-size:15.5px;color:var(--text-2);max-width:62ch;
  margin-bottom:32px;line-height:1.85;
}
.hero-contact{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;
  font-size:14px;color:var(--text-2);
}
.hero-contact a{
  color:var(--text-2);border-bottom:1px solid transparent;
  transition:color .15s ease,border-color .15s ease;
}
.hero-contact a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.hero-contact .sep{color:var(--text-3);user-select:none}
.copy-mini{
  display:inline-grid;place-items:center;width:22px;height:22px;
  margin-left:2px;border-radius:5px;color:var(--text-3);
  transition:color .15s ease,background-color .15s ease;vertical-align:middle;
}
.copy-mini:hover{color:var(--accent);background:var(--accent-bg)}
.copy-mini svg{width:12px;height:12px}

/* =========================================================
   Section heading
   ========================================================= */
.sec-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:8px;
}
.sec-title{
  font-size:12.5px;font-weight:650;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-2);
}
.sec-num{
  font-size:12px;font-weight:600;color:var(--text-3);
  font-variant-numeric:tabular-nums;letter-spacing:.05em;
}

/* =========================================================
   Stats
   ========================================================= */
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);
  border-bottom:1px solid var(--line);
}
.stat{padding:30px 24px 30px 0;border-right:1px solid var(--line)}
.stat:last-child{border-right:none;padding-right:0}
.stat:not(:first-child){padding-left:24px}
.stat-value{
  font-size:clamp(26px,3.4vw,34px);font-weight:700;
  letter-spacing:-.03em;line-height:1.1;color:var(--text);
  font-variant-numeric:tabular-nums;
}
.stat-label{font-size:13px;font-weight:550;color:var(--text);margin-top:8px}
.stat-desc{font-size:12.5px;color:var(--text-3);margin-top:2px}

/* =========================================================
   Tabs
   ========================================================= */
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:4px}
.tab{
  position:relative;padding:14px 0;font-size:14px;font-weight:550;
  color:var(--text-3);margin-bottom:-1px;
  border-bottom:1.5px solid transparent;
  transition:color .18s ease,border-color .18s ease;
}
.tab:hover{color:var(--text-2)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:2px}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--text)}
.tabpanel[hidden]{display:none}
.tabpanel:not([hidden]){animation:fadeIn .3s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* =========================================================
   Experience / Projects
   ========================================================= */
.item{padding:30px 0;border-bottom:1px solid var(--line-2)}
.item:last-child{border-bottom:none;padding-bottom:8px}
.item-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:24px;margin-bottom:14px;
}
.item-role{font-size:16px;font-weight:650;letter-spacing:-.01em;line-height:1.4}
.item-org{font-size:13.5px;color:var(--text-2);margin-top:3px}
.item-time{
  font-size:13px;color:var(--text-3);white-space:nowrap;
  font-variant-numeric:tabular-nums;padding-top:2px;
}
.item-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{
  font-size:11.5px;font-weight:550;color:var(--text-2);background:var(--bg-soft);
  border:1px solid var(--line-2);padding:3px 9px;border-radius:5px;letter-spacing:.01em;
}
[data-theme="dark"] .tag{background:#161616}
.points{display:grid;gap:7px}
.points li{
  position:relative;padding-left:16px;font-size:14.5px;
  color:var(--text-2);line-height:1.75;
}
.points li::before{
  content:"";position:absolute;left:0;top:.72em;
  width:4px;height:4px;border-radius:50%;background:var(--text-3);
}
.points b{color:var(--text);font-weight:650}

.metrics{
  display:flex;flex-wrap:wrap;gap:28px;margin-top:16px;
  padding-top:16px;border-top:1px dashed var(--line);
}
.metric{display:flex;flex-direction:column;gap:1px}
.metric b{
  font-size:18px;font-weight:700;color:var(--accent);
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;
}
.metric span{font-size:11.5px;color:var(--text-3);font-weight:500}

/* =========================================================
   Skills
   ========================================================= */
.skill-list{border-bottom:1px solid var(--line)}
.skill-row{
  display:grid;grid-template-columns:200px 1fr;gap:40px;
  padding:20px 0;border-top:1px solid var(--line-2);
}
.skill-row:first-child{border-top:none}
.skill-name{font-size:14px;font-weight:600;color:var(--text);letter-spacing:-.005em}
.skill-desc{font-size:14px;color:var(--text-2);line-height:1.75}
.toolbox{
  padding:24px 0 4px;display:flex;flex-wrap:wrap;
  align-items:baseline;gap:8px 10px;
}
.toolbox-label{
  font-size:12px;font-weight:650;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text-3);margin-right:6px;
}
.toolbox span{font-size:12.5px;color:var(--text-2);padding:3px 0}

/* =========================================================
   Education / Certificates
   ========================================================= */
.edu-grid{
  display:grid;grid-template-columns:1.25fr 1fr;
  gap:56px;padding-top:26px;
}
.edu-school{font-size:17px;font-weight:650;letter-spacing:-.01em;line-height:1.4}
.edu-major{font-size:14px;color:var(--text-2);margin-top:4px}
.edu-meta{margin-top:18px;display:grid;gap:8px}
.edu-meta-row{
  display:grid;grid-template-columns:72px 1fr;gap:12px;font-size:13.5px;
}
.edu-meta-row dt{color:var(--text-3);font-weight:500}
.edu-meta-row dd{color:var(--text-2)}

.cert-list{display:grid;gap:14px}
.cert{display:flex;gap:12px;align-items:flex-start}
.cert-dot{
  width:5px;height:5px;border-radius:50%;background:var(--accent);
  margin-top:9px;flex:none;
}
.cert b{font-size:14px;font-weight:600;display:block;line-height:1.5}
.cert span{font-size:12.5px;color:var(--text-3)}

/* ——— 证书图片画廊 ——— */
.gallery{
  margin-top:28px;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.gallery figure{
  position:relative;
  margin:0;
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
  background:var(--bg-soft);
  cursor:zoom-in;
  aspect-ratio:4 / 3;
  transition:transform .25s cubic-bezier(.22,.8,.28,1),
             border-color .2s ease,
             box-shadow .25s ease;
}
.gallery figure:hover{
  transform:translateY(-3px);
  border-color:var(--accent);
  box-shadow:0 14px 32px -18px rgba(26,86,219,.45);
}
.gallery figure:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:3px;
}

.gallery img{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
  transition:transform .4s cubic-bezier(.22,.8,.28,1);
}
.gallery figure:hover img{transform:scale(1.045)}

.gallery figcaption{
  position:absolute;
  left:0;right:0;bottom:0;
  padding:22px 12px 10px;
  font-size:11.5px;
  font-weight:550;
  color:#fff;
  letter-spacing:.02em;
  background:linear-gradient(to top,rgba(0,0,0,.68),rgba(0,0,0,.28) 55%,transparent);
  pointer-events:none;
}

.gallery .zoom-hint{
  position:absolute;
  top:10px;right:10px;
  width:26px;height:26px;
  border-radius:7px;
  display:grid;place-items:center;
  background:rgba(0,0,0,.5);
  color:#fff;font-size:12px;
  opacity:0;
  transition:opacity .2s ease,transform .2s ease;
  pointer-events:none;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}
.gallery figure:hover .zoom-hint{opacity:1;transform:scale(1.05)}

/* 骨架占位 */
.gallery figure.is-loading::before{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(100deg,
    var(--bg-soft) 30%,
    var(--line-2) 50%,
    var(--bg-soft) 70%);
  background-size:220% 100%;
  animation:shimmer 1.4s ease-in-out infinite;
  z-index:1;
}
@keyframes shimmer{
  from{background-position:180% 0}
  to{background-position:-80% 0}
}

/* =========================================================
   Lightbox
   ========================================================= */
.lightbox{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.9);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  display:grid;place-items:center;
  padding:48px;
  opacity:0;pointer-events:none;
  transition:opacity .22s ease;
}
.lightbox.show{opacity:1;pointer-events:auto}
.lightbox img{
  max-width:min(94vw,1000px);
  max-height:84vh;
  object-fit:contain;
  border-radius:10px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
  transform:scale(.97);
  transition:transform .28s cubic-bezier(.22,.8,.28,1);
}
.lightbox.show img{transform:scale(1)}
.lightbox-cap{
  position:absolute;
  left:50%;bottom:26px;
  transform:translateX(-50%);
  font-size:13px;color:rgba(255,255,255,.8);
  letter-spacing:.03em;
  white-space:nowrap;
}
.lightbox-close{
  position:absolute;top:22px;right:26px;
  width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.1);
  color:#fff;font-size:17px;
  display:grid;place-items:center;
  transition:background-color .15s ease,transform .15s ease;
}
.lightbox-close:hover{background:rgba(255,255,255,.22);transform:rotate(90deg)}

/* =========================================================
   Footer
   ========================================================= */
.footer{margin-top:80px;padding:28px 0 44px;border-top:1px solid var(--line)}
.footer-inner{
  display:flex;justify-content:space-between;align-items:center;
  gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-3);
}

/* =========================================================
   Misc
   ========================================================= */
.to-top{
  position:fixed;right:24px;bottom:24px;z-index:40;
  width:38px;height:38px;border-radius:9px;
  border:1px solid var(--line);background:var(--bg);color:var(--text-2);
  display:grid;place-items:center;font-size:15px;box-shadow:var(--shadow);
  opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity .2s ease,transform .2s ease,color .15s ease,border-color .15s ease;
}
.to-top.show{opacity:1;transform:none;pointer-events:auto}
.to-top:hover{color:var(--accent);border-color:var(--accent)}

#toast{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,10px);
  background:var(--text);color:var(--bg);font-size:13px;font-weight:550;
  padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;z-index:60;white-space:nowrap;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

.js .reveal{
  opacity:0;transform:translateY(10px);
  transition:opacity .6s ease,transform .6s cubic-bezier(.22,.8,.28,1);
  transition-delay:var(--d,0ms);
}
.js .reveal.is-in{opacity:1;transform:none}

/* =========================================================
   Responsive
   ========================================================= */
@media (max-width:820px){
  .edu-grid{grid-template-columns:1fr;gap:40px}
}
@media (max-width:700px){
  .wrap,.nav-inner{width:min(880px,100% - 36px)}
  .section{padding-top:56px;scroll-margin-top:68px}
  .hero{padding-top:108px}
  .hero-summary{font-size:15px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat{padding:24px 0}
  .stat:nth-child(odd){padding-right:20px;border-right:1px solid var(--line)}
  .stat:nth-child(even){padding-left:20px;border-right:none}
  .stat:nth-child(1),.stat:nth-child(2){border-bottom:1px solid var(--line)}
  .skill-row{grid-template-columns:1fr;gap:6px;padding:18px 0}
  .item-head{flex-direction:column;gap:4px}
  .item-time{padding-top:0}
  .metrics{gap:22px}
  .nav-links{display:none}
  .to-top{right:16px;bottom:16px}
  .lightbox{padding:24px}
  .lightbox-close{top:14px;right:14px;width:38px;height:38px}
}
@media (max-width:480px){
  body{font-size:15px}
  .print-btn span{display:none}
  .print-btn{padding:8px}
  .print-btn svg{width:15px;height:15px}
  .gallery{grid-template-columns:1fr;gap:12px}
  .gallery figure{aspect-ratio:16 / 11}
}

/* =========================================================
   Print
   ========================================================= */
@media print{
  :root{
    --bg:#ffffff;--bg-soft:#ffffff;--text:#000000;
    --text-2:#333333;--text-3:#666666;--line:#d0d0d0;
    --line-2:#e6e6e6;--accent:#1a56db;--accent-bg:#ffffff;
  }
  @page{margin:16mm 14mm}
  html,body{background:#fff!important}
  body{font-size:11.5px;line-height:1.6}
  .nav,.to-top,#toast,.copy-mini,.no-print,.lightbox{display:none!important}
  .wrap{width:100%;max-width:none;margin:0}
  .hero{padding-top:0}
  .hero h1{font-size:30px;margin-bottom:8px}
  .hero-roles{font-size:12px;margin-bottom:16px}
  .hero-summary{font-size:11.5px;margin-bottom:18px;max-width:none}
  .section{padding-top:26px;break-inside:avoid}
  .section:last-of-type{padding-bottom:0}
  .sec-head{padding-bottom:8px;margin-bottom:0}
  .tabpanel[hidden]{display:block!important}
  .tabpanel{animation:none!important}
  .js .reveal{opacity:1!important;transform:none!important;transition:none!important}
  .item{padding:16px 0;break-inside:avoid}
  .points li{font-size:11px}
  .stat{padding:16px 16px 16px 0}
  .stat:not(:first-child){padding-left:16px}
  .stat-value{font-size:22px}
  .skill-row{padding:12px 0}
  .edu-grid{gap:32px;padding-top:16px}
  .gallery{margin-top:14px;gap:8px;grid-template-columns:1fr 1fr}
  .gallery figure{
    aspect-ratio:4 / 3;
    break-inside:avoid;
    transform:none!important;
    box-shadow:none!important;
    border-color:#d0d0d0!important;
  }
  .gallery figure.is-loading::before{display:none}
  .gallery .zoom-hint{display:none!important}
  .footer{margin-top:32px;padding:16px 0 0}
  a{color:#000!important}
  .metric b{color:#1a56db}
}

/* =========================================================
   Reduced motion
   ========================================================= */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;
  }
  .js .reveal{opacity:1!important;transform:none!important}
  .gallery figure:hover{transform:none}
  .gallery figure:hover img{transform:none}
}
</style>
</head>
<body>

<!-- ================= Nav ================= -->
<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="#top">马天赐</a>
    <nav class="nav-links" id="navLinks" aria-label="页面导航"></nav>
    <div class="nav-actions">
      <button class="icon-btn" id="themeBtn" type="button" aria-label="切换主题" title="切换主题">🌙</button>
      <button class="print-btn no-print" id="printBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9V3h12v6"/><path d="M6 18H4.5A1.5 1.5 0 0 1 3 16.5V11a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5.5A1.5 1.5 0 0 1 19.5 18H18"/><rect x="6" y="14" width="12" height="7" rx="1"/>
        </svg>
        <span>打印 / PDF</span>
      </button>
    </div>
  </div>
</header>

<main id="top">

  <!-- ================= Hero ================= -->
  <section class="hero" id="hero">
    <div class="wrap">
      <h1 class="reveal">马天赐</h1>
      <p class="hero-roles reveal" id="heroRoles" style="--d:60ms"></p>
      <p class="hero-summary reveal" id="heroSummary" style="--d:120ms"></p>
      <div class="hero-contact reveal" id="heroContact" style="--d:180ms"></div>
    </div>
  </section>

  <!-- ================= Highlights ================= -->
  <section class="section" id="highlights">
    <div class="wrap">
      <div class="sec-head reveal">
        <h2 class="sec-title">亮点成果</h2>
        <span class="sec-num">01</span>
      </div>
      <div class="stats reveal" id="statGrid" style="--d:80ms"></div>
    </div>

  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 1800);
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise((resolve, reject) => {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error("copy failed"));
    } catch (e) { reject(e); }
  });
}

function initScrollSpy() {
  if (!("IntersectionObserver" in window)) return;
  const links = $$("#navLinks a");
  const secs = NAV.map(n => document.getElementById(n.id)).filter(Boolean);
  const spy = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      links.forEach(a => a.classList.toggle("is-active", a.getAttribute("href") === "#" + en.target.id));
    });
  }, { rootMargin: "-45% 0px -50% 0px", threshold: 0 });
  secs.forEach(s => spy.observe(s));
}

/* =========================================================
   Tabs
   ========================================================= */
function bindTabs(tabWrap, panelWrap) {
  const tabs = Array.from(tabWrap.querySelectorAll('[role="tab"]'));
  const panels = Array.from(panelWrap.querySelectorAll('[role="tabpanel"]'));
  if (!tabs.length) return;

  function select(idx) {
    tabs.forEach((t, i) => {
      const on = i === idx;
      t.setAttribute("aria-selected", on ? "true" : "false");
      t.tabIndex = on ? 0 : -1;
      if (panels[i]) panels[i].hidden = !on;
    });
  }

  tabs.forEach((t, i) => {
    t.addEventListener("click", () => select(i));
    t.addEventListener("keydown", e => {
      let next = null;
      if (e.key === "ArrowRight") next = (i + 1) % tabs.length;
      else if (e.key === "ArrowLeft") next = (i - 1 + tabs.length) % tabs.length;
      else if (e.key === "Home") next = 0;
      else if (e.key === "End") next = tabs.length - 1;
      if (next !== null) { e.preventDefault(); select(next); tabs[next].focus(); }
    });
  });

  select(0);
}

  `).join("");

  // 图片加载完成后移除骨架 / 失败时隐藏
  $$("#gallery figure").forEach(fig => {
    const im = fig.querySelector("img");
    if (!im) return;
    const done = () => fig.classList.remove("is-loading");
    const fail = () => { fig.style.display = "none"; };
    if (im.complete) {
      im.naturalWidth > 0 ? done() : fail();
    } else {
      im.addEventListener("load", done, { once: true });
      im.addEventListener("error", fail, { once: true });
    }
  });
}

/* =========================================================
   Lightbox
   ========================================================= */
function initLightbox() {
  const lb    = $("#lightbox");
  const lbImg = $("#lightboxImg");
  const lbCap = $("#lightboxCap");

  let lastFocus = null;

  function open(src, alt, cap) {
    lastFocus = document.activeElement;
    lbImg.src = src;
    lbImg.alt = alt || "";
    lbCap.textContent = cap || "";
    lb.classList.add("show");
    document.body.style.overflow = "hidden";
    lb.querySelector(".lightbox-close").focus();
  }

  function close() {
    lb.classList.remove("show");
    document.body.style.overflow = "";
    setTimeout(() => { lbImg.src = ""; lbCap.textContent = ""; }, 240);
    if (lastFocus && typeof lastFocus.focus === "function") lastFocus.focus();
  }

  // 点击图片打开
  document.addEventListener("click", e => {
    const fig = e.target.closest("#gallery figure");
    if (!fig) return;
    open(fig.dataset.src, fig.dataset.alt, fig.dataset.cap);
  });

  // 键盘：Enter / Space 打开
  document.addEventListener("keydown", e => {
    const fig = e.target.closest && e.target.closest("#gallery figure");
    if (fig && (e.key === "Enter" || e.key === " ")) {
      e.preventDefault();
      open(fig.dataset.src, fig.dataset.alt, fig.dataset.cap);
      return;
    }
    if (e.key === "Escape" && lb.classList.contains("show")) {
      e.preventDefault();
      close();
    }
  });

  // 点击遮罩 / 关闭按钮
  lb.addEventListener("click", e => {
    if (e.target === lb || e.target.closest(".lightbox-close")) close();
  });
}

/* =========================================================
   Animations
   ========================================================= */
function animateNumber(node, raw) {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    node.textContent = raw; return;
  }
  const m = String(raw).match(/^(\D*)(\d+(?:\.\d+)?)(.*)$/);
  if (!m) { node.textContent = raw; return; }
  const pre = m[1], target = parseFloat(m[2]), post = m[3];
  const dur = 900, start = performance.now();
  function step(now) {
    const p = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    node.textContent = pre + Math.round(target * eased) + post;
    if (p < 1) requestAnimationFrame(step);
    else node.textContent = raw;
  }
  requestAnimationFrame(step);
}

function initReveal() {
  const nodes = $$(".reveal");
  if (!("IntersectionObserver" in window)) {
    nodes.forEach(n => n.classList.add("is-in"));
    $$("[data-num]").forEach(n => n.textContent = n.dataset.num);
    return;
  }
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      en.target.classList.add("is-in");
      en.target.querySelectorAll("[data-num]").forEach(n => animateNumber(n, n.dataset.num));
      io.unobserve(en.target);
    });
  }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
  nodes.forEach(n => io.observe(n));
}

/* =========================================================
   Theme / Actions
   ========================================================= */
function updateThemeBtn(theme) {
  const btn = $("#themeBtn");
  btn.textContent = theme === "dark" ? "☀️" : "🌙";
  btn.setAttribute("title", theme === "dark" ? "切换为浅色模式" : "切换为深色模式");
}

function initTheme() {
  const saved = localStorage.getItem("mtc-theme");
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const theme = saved || (prefersDark ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
  updateThemeBtn(theme);

  $("#themeBtn").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("mtc-theme", next);
    updateThemeBtn(next);
  });
}

function initActions() {
  $("#printBtn").addEventListener("click", () => window.print());

  document.addEventListener("click", e => {
    const btn = e.target.closest(".copy-mini");
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    const text = btn.dataset.copy;
    copyText(text)
      .then(() => toast("已复制 " + text))
      .catch(() => toast("复制失败，请手动复制"));
  });

  const toTop = $("#toTop");
  toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
  window.addEventListener("scroll", () => {
    toTop.classList.toggle("show", window.scrollY > 600);
  }, { passive: true });

  window.addEventListener("beforeprint", () => {
    $$("[data-num]").forEach(n => n.textContent = n.dataset.num);
    $$(".reveal").forEach(n => n.classList.add("is-in"));
    $$("#gallery figure").forEach(f => f.classList.remove("is-loading"));
  });
}
